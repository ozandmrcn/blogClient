server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Fingerprinted assets are immutable, so they can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed build output, but the entry document must never be cached or
    # clients would keep loading a stale asset manifest after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are client-side routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
