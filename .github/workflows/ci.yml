name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Vite refuses to inline undefined VITE_* values, and the build only
          # needs a syntactically valid URL to produce output.
          VITE_API_URL: http://localhost:3000

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist
          retention-days: 7
